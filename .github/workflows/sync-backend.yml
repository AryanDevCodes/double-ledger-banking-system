name: Sync backend-only repo

on:
  push:
    branches:
      - backend-alignment-upgrade
    paths:
      - "bank-backend/**"
  workflow_dispatch: {}

concurrency:
  group: sync-backend-only
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push bank-backend to backend-only/main
        env:
          BACKEND_ONLY_PUSH_TOKEN: ${{ secrets.BACKEND_ONLY_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_ONLY_PUSH_TOKEN:-}" ]; then
            echo "BACKEND_ONLY_PUSH_TOKEN is not set. Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # Use an explicit username so GitHub authenticates as the PAT owner.
          git remote add backend-only "https://AryanDevCodes:${BACKEND_ONLY_PUSH_TOKEN}@github.com/AryanDevCodes/double-ledger-banking-system-BACKEND.git"

          # Mirror strategy: split subtree and force-push to backend-only/main.
          # This avoids non-fast-forward failures when backend-only history differs.
          remote_sha="$(git ls-remote backend-only refs/heads/main | awk '{print $1}')"
          split_sha="$(git subtree split --prefix bank-backend)"

          if [ -n "${remote_sha}" ]; then
            git push backend-only "${split_sha}:refs/heads/main" --force-with-lease=refs/heads/main:"${remote_sha}"
          else
            git push backend-only "${split_sha}:refs/heads/main" --force
          fi
