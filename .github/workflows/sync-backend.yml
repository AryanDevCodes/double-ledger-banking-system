name: Sync backend-only repo

on:
  push:
    branches:
      - backend-alignment-upgrade
    paths:
      - "bank-backend/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push bank-backend subtree to backend-only/main
        env:
          BACKEND_ONLY_PUSH_TOKEN: ${{ secrets.BACKEND_ONLY_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git remote add backend-only "https://x-access-token:${BACKEND_ONLY_PUSH_TOKEN}@github.com/AryanDevCodes/double-ledger-banking-system-BACKEND.git"
          git subtree push --prefix bank-backend backend-onl
