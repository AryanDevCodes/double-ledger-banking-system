name: Sync backend-only repo

on:
  push:
    branches:
      - backend-alignment-upgrade
    paths:
      - "bank-backend/**"
  workflow_dispatch: {}

concurrency:
  group: sync-backend-only
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      metadata: read
      packages: read

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push bank-backend subtree to backend-only/main
        env:
          BACKEND_ONLY_PUSH_TOKEN: ${{ secrets.BACKEND_ONLY_PUSH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${BACKEND_ONLY_PUSH_TOKEN:-}" ]; then
            echo "BACKEND_ONLY_PUSH_TOKEN is not set."
            echo "Add it in: Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"

          # Remove any auth header that checkout or runner might have set
          git config --local --unset-all http.https://github.com/.extraheader || true

          # Define backend remote without embedding token in URL
          git remote remove backend-only 2>/dev/null || true
          git remote add backend-only https://github.com/AryanDevCodes/double-ledger-banking-system-BACKEND.git

          # Build Basic auth header for PAT (username must be x-access-token)
          AUTH="$(printf 'x-access-token:%s' "$BACKEND_ONLY_PUSH_TOKEN" | base64 -w0)"

          # Split subtree commit
          split_sha="$(git subtree split --prefix bank-backend)"

          # Check if target branch exists on remote (authenticated)
          remote_sha="$(
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
              ls-remote backend-only refs/heads/main | awk '{print $1}'
          )"

          if [ -n "${remote_sha}" ]; then
            # Safe force update only if remote main is still at remote_sha
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
              push backend-only "${split_sha}:refs/heads/main" \
              --force-with-lease=refs/heads/main:"${remote_sha}"
          else
            # First push when main doesn't exist yet
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
              push backend-only "${split_sha}:refs/heads/main" --force
          fi