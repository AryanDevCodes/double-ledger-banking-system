server:
  servlet:
    context-path: /api

spring:
  sql:
    init:
      mode: never
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  cache:
    type: simple
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh:
    expiration: 604800000

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://localhost:8081
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@bank.local}
    reset-link-base: ${RESET_LINK_BASE:http://localhost:5173/reset-password}
  rate-limit:
    enabled: true
    login:        { capacity: 10, refill-seconds: 60 }
    forgot:       { capacity: 5,  refill-seconds: 60 }
    upi-pay:      { capacity: 20, refill-seconds: 60 }
  webhook:
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    max-retries: 3