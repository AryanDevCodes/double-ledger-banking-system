server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  sql:
    init:
      mode: never

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  cache:
    type: simple

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh:
    expiration: 604800000

app:
  cors:
    allowed-origins:
      - ${FRONTEND_URL}

  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@yourdomain.com}
    reset-link-base: ${FRONTEND_URL}/reset-password

  rate-limit:
    enabled: true
    login:
      capacity: 10
      refill-seconds: 60
    forgot:
      capacity: 5
      refill-seconds: 60
    upi-pay:
      capacity: 20
      refill-seconds: 60

  webhook:
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    max-retries: 3

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN